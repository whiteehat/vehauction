<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VehAuction — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      height: 100vh;
      color: #ffffff;
      overflow: hidden;
    }

    /* BACKGROUND SLIDESHOW */
    .slideshow {
      position: fixed;
      inset: 0;
      z-index: -2;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      animation: fade 24s infinite;
    }

    .slide:nth-child(1) {
      background-image: url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");
      animation-delay: 0s;
    }

    .slide:nth-child(2) {
      background-image: url("https://images.unsplash.com/photo-1542362567-b07e54358753");
      animation-delay: 6s;
    }

    .slide:nth-child(3) {
      background-image: url("https://images.unsplash.com/photo-1619767886558-efdc259cde1a");
      animation-delay: 12s;
    }

    .slide:nth-child(4) {
      background-image: url("https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2");
      animation-delay: 18s;
    }

    @keyframes fade {
      0% { opacity: 0; }
      8% { opacity: 1; }
      25% { opacity: 1; }
      33% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        rgba(2, 6, 23, 0.8),
        rgba(2, 6, 23, 0.92)
      );
      z-index: -1;
    }

    /* LAYOUT */
    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 36px 26px;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
      animation: rise 1.1s ease forwards;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .logo span {
      color: #38bdf8;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    p {
      font-size: 15.5px;
      line-height: 1.6;
      color: #e5e7eb;
      margin-bottom: 14px;
    }

    .highlight {
      color: #38bdf8;
      font-weight: 600;
    }

    /* WAITLIST FORM */
    form {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      outline: none;
    }

    button {
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #020617;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .note {
      margin-top: 10px;
      font-size: 12.5px;
      color: #9ca3af;
    }

    .footer {
      margin-top: 26px;
      font-size: 12.5px;
      color: #9ca3af;
    }

    /* DESKTOP POLISH */
    @media (min-width: 768px) {
      .card {
        padding: 56px 48px;
      }

      .logo {
        font-size: 44px;
      }

      h1 {
        font-size: 32px;
      }

      p {
        font-size: 17px;
      }

      form {
        flex-direction: row;
      }

      input {
        flex: 1;
      }

      button {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND -->
  <div class="slideshow">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>
  <div class="overlay"></div>

  <!-- CONTENT -->
  <div class="container">
    <div class="card">
      <div class="logo">Veh<span>Auction</span></div>

      <h1>Buy & Sell Vehicles With Confidence</h1>

      <p>
        VehAuction is building
        <span class="highlight">Africa’s #1 trusted vehicle auction platform</span>
        with verified inspections, secure bidding, and transparent ownership
        transfers.
      </p>

      <!-- WAITLIST FORM -->
      <form action="https://formspree.io/f/mreaeqpr" method="POST">
        <input
          type="email"
          name="email"
          placeholder="Enter your email"
          required
        />
        <button type="submit">Join the Waitlist</button>
      </form>

      <div class="note">
        Be the first to know when we launch.
      </div>

      <div class="footer">
        © <span id="year"></span> VehAuction. All rights reserved.
      </div>
    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
